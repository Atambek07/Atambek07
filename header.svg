<svg fill="none" viewBox="0 0 900 250" width="900" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="55%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0A191F" />
    </linearGradient>

    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F796" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F796" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F796" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00F796" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00F796" stroke-width="0.4" stroke-opacity="0.07" />
    </pattern>

    <clipPath id="ecgClip">
      <rect x="556" y="72" width="308" height="62" rx="6" />
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 40px;
      fill: #F0F6FC;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 14.5px;
      fill: #00F796;
      letter-spacing: 0.3px;
    }
    .meta {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 12px;
      fill: #8B949E;
    }
    .hud-label {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #8B949E;
      letter-spacing: 0.8px;
    }
    .hud-val {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 10.5px;
      fill: #00F796;
      font-weight: 600;
    }
    .node-text {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #C9D1D9;
      font-weight: 600;
    }
    .log-text {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 9.5px;
      fill: #7EE787;
    }
    .status-text {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 11px;
      fill: #00F796;
      font-weight: 600;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; r: 4.5; }
      50% { opacity: 0.3; r: 3; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes scanBottom {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    @keyframes ecgScroll {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-154px); }
    }
    @keyframes packetTx {
      0% { cx: 626; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 794; opacity: 0; }
    }
    @keyframes packetRx {
      0% { cx: 794; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 626; opacity: 0; }
    }
    @keyframes logFade {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.45; }
    }

    .pulse-dot { animation: pulseDot 2s infinite ease-in-out; }
    .cursor { animation: blink 1s infinite; }
    .scan-beam { animation: scanBottom 5.5s infinite linear; }
    .ecg-wave { animation: ecgScroll 3.2s infinite linear; }
    .pkt-tx { animation: packetTx 2.2s infinite ease-in-out; }
    .pkt-rx { animation: packetRx 2.6s infinite ease-in-out 1.1s; }
    .log-pulse { animation: logFade 3s infinite ease-in-out; }
  </style>

  <!-- Base Terminal Window -->
  <rect width="898" height="248" x="1" y="1" rx="14" fill="url(#bgGrad)" stroke="#21262D" stroke-width="1.5" />
  <rect width="898" height="248" x="1" y="1" rx="14" fill="url(#grid)" />

  <!-- Top Bar -->
  <circle cx="28" cy="24" r="5" fill="#FF5F56" />
  <circle cx="46" cy="24" r="5" fill="#FFBD2E" />
  <circle cx="64" cy="24" r="5" fill="#27C93F" />
  <text x="86" y="28" class="meta">atambek@oracle-vps:~ — zsh — telemetry-daemon</text>

  <!-- Live Status Pill -->
  <rect x="655" y="13" width="222" height="22" rx="11" fill="#00F796" fill-opacity="0.1" stroke="#00F796" stroke-opacity="0.35" />
  <circle cx="672" cy="24" r="4.5" fill="#00F796" class="pulse-dot" />
  <text x="685" y="28" class="status-text">AGENT & CLOUD: ONLINE 24/7</text>

  <!-- Top Divider -->
  <line x1="1" y1="46" x2="899" y2="46" stroke="#21262D" stroke-width="1" />

  <!-- Left Column: Identity -->
  <text x="34" y="102" class="title">Atambek</text>
  <rect x="215" y="72" width="14" height="32" fill="#00F796" class="cursor" />

  <text x="34" y="136" class="subtitle">> Software Engineer | Backend, Cloud & IoT</text>

  <text x="34" y="172" class="meta">📍 Bishkek / Razzakov, KG  •  🎓 Software Eng @ KSTU</text>
  <text x="34" y="196" class="meta">⚡ Java (Spring) • Python • C++ • Linux • Raspberry Pi</text>
  <text x="34" y="220" class="meta">🛰️ NASA Space Apps 2026  •  🤖 24/7 Autonomous Agents</text>

  <!-- Right Column: Live Telemetry & Packet HUD -->
  <rect x="546" y="56" width="328" height="176" rx="10" fill="#090D14" fill-opacity="0.85" stroke="#21262D" stroke-width="1.2" />

  <!-- HUD Header -->
  <text x="558" y="70" class="hud-label">VITALS & TELEMETRY STREAM</text>
  <text x="802" y="70" class="hud-val">72 BPM | 99%</text>

  <!-- ECG / Telemetry Box -->
  <rect x="556" y="76" width="308" height="58" rx="6" fill="#0D1117" stroke="#1F2937" stroke-width="1" />
  <line x1="556" y1="105" x2="864" y2="105" stroke="#00F796" stroke-opacity="0.12" stroke-dasharray="3 3" />

  <!-- Animated ECG Waveform (2 identical 154px segments for seamless loop) -->
  <g clip-path="url(#ecgClip)">
    <g class="ecg-wave">
      <path d="M 556 105 L 584 105 L 591 99 L 597 105 L 605 105 L 610 83 L 616 126 L 622 91 L 627 105 L 638 105 L 646 97 L 654 105 L 710 105
               L 738 105 L 745 99 L 751 105 L 759 105 L 764 83 L 770 126 L 776 91 L 781 105 L 792 105 L 800 97 L 808 105 L 864 105
               L 892 105 L 899 99 L 905 105 L 913 105 L 918 83 L 924 126 L 930 91 L 935 105 L 946 105 L 954 97 L 962 105 L 1018 105" fill="none" stroke="#00F796" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Packet Stream Visualizer (Oracle VPS <-> SSH Tunnel <-> Edge Node) -->
  <text x="558" y="150" class="hud-label">REVERSE SSH & PACKET FLOW</text>
  <text x="814" y="150" class="hud-val" fill="#38BDF8">0% LOSS</text>

  <!-- Left Node: Oracle VPS -->
  <rect x="556" y="158" width="70" height="24" rx="5" fill="#161B22" stroke="#00F796" stroke-opacity="0.5" />
  <text x="565" y="173" class="node-text">ORACLE-VPS</text>

  <!-- Tunnel Line -->
  <line x1="626" y1="170" x2="794" y2="170" stroke="#30363D" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="682" y="164" class="hud-label" font-size="8.5">SSH-TUNNEL</text>

  <!-- Moving Packets -->
  <circle cx="626" cy="170" r="3.5" fill="#00F796" class="pkt-tx" />
  <circle cx="794" cy="170" r="3" fill="#38BDF8" class="pkt-rx" />

  <!-- Right Node: Edge / RPi -->
  <rect x="794" y="158" width="70" height="24" rx="5" fill="#161B22" stroke="#38BDF8" stroke-opacity="0.5" />
  <text x="805" y="173" class="node-text">EDGE / RPI</text>

  <!-- Live Terminal Log Footer inside HUD -->
  <rect x="556" y="191" width="308" height="32" rx="5" fill="#0D1117" stroke="#1F2937" stroke-width="1" />
  <text x="564" y="204" class="log-text log-pulse">[OK] systemd: ai-agent.service active (running)</text>
  <text x="564" y="217" class="log-text" fill="#8B949E">[TX] telemetry_pkt 128B -> 200 OK (14ms)</text>

  <!-- Bottom Scanning Beam -->
  <rect x="0" y="246" width="900" height="3" fill="url(#neonLine)" class="scan-beam" />
</svg>